    <!-- CSS 핵심: 이전 페이지와 동일한 디자인 시스템 유지 -->
    <style>
        :root {
            --color-primary: #00FFC2; /* Neon Green */
            --color-secondary: #FF00FF; /* Magenta */
            --color-background: #111111; /* Dark Gray */
            --color-text-light: #EEEEEE;
            --color-text-dark: #333333;
            --font-family-display: 'Chosunilbo_myungjo_ttf', sans-serif; /* 예시 폰트 */
            --font-family-body: 'Noto Sans KR', sans-serif;
            --spacing-unit: 8px;
        }

        body {
            font-family: var(--font-family-body);
            background-color: var(--color-background);
            color: var(--color-text-light);
            margin: 0;
            line-height: 1.6;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: calc(var(--spacing-unit) * 3);
        }

        header {
            background-color: var(--color-background);
            border-bottom: 2px solid var(--color-primary);
            padding: calc(var(--spacing-unit) * 2) 0;
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .header-content {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-family: var(--font-family-display);
            font-size: 2.5em;
            color: var(--color-primary);
            text-decoration: none;
            letter-spacing: -1px;
            text-shadow: 0 0 10px var(--color-primary);
        }

        nav ul {
            list-style: none;
            margin: 0;
            padding: 0;
            display: flex;
            gap: calc(var(--spacing-unit) * 4);
        }

        nav a {
            color: var(--color-text-light);
            text-decoration: none;
            font-size: 1.1em;
            padding: var(--spacing-unit) calc(var(--spacing-unit) * 2);
            position: relative;
            transition: color 0.3s ease, text-shadow 0.3s ease;
        }

        nav a:hover, nav a.active {
            color: var(--color-primary);
            text-shadow: 0 0 8px var(--color-primary);
        }

        nav a::before {
            content: '';
            position: absolute;
            bottom: -5px;
            left: 50%;
            width: 0;
            height: 2px;
            background-color: var(--color-primary);
            transition: width 0.3s ease, left 0.3s ease;
        }

        nav a:hover::before, nav a.active::before {
            width: 100%;
            left: 0;
        }

        .hero-section {
            background: linear-gradient(rgba(17, 17, 17, 0.8), rgba(17, 17, 17, 0.8)), url('https://source.unsplash.com/random/1600x900/?seoul-night-city') no-repeat center center/cover;
            min-height: 400px;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: calc(var(--spacing-unit) * 8) calc(var(--spacing-unit) * 3);
            border-bottom: 2px solid var(--color-secondary);
        }

        .hero-content {
            max-width: 800px;
        }

        .hero-title {
            font-family: var(--font-family-display);
            font-size: 3.5em;
            color: var(--color-primary);
            margin-bottom: var(--spacing-unit) * 2;
            text-shadow: 0 0 15px var(--color-primary);
            line-height: 1.2;
        }

        .hero-subtitle {
            font-size: 1.4em;
            color: var(--color-text-light);
            margin-bottom: calc(var(--spacing-unit) * 4);
            font-weight: 300;
        }

        .main-content {
            padding: calc(var(--spacing-unit) * 6) 0;
            max-width: 900px; /* Long-form content often benefits from a narrower width */
            margin: 0 auto;
        }

        .section {
            background-color: #1a1a1a;
            border: 1px solid var(--color-secondary);
            margin-bottom: calc(var(--spacing-unit) * 6);
            padding: calc(var(--spacing-unit) * 5);
            position: relative;
            overflow: hidden;
        }

        .section::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 5px;
            background: linear-gradient(to right, var(--color-primary), var(--color-secondary));
            animation: border-glow 3s infinite alternate;
        }

        @keyframes border-glow {
            0% {
                box-shadow: 0 0 5px var(--color-primary);
            }
            100% {
                box-shadow: 0 0 15px var(--color-secondary);
            }
        }

        .section-title {
            font-family: var(--font-family-display);
            font-size: 2.2em;
            color: var(--color-primary);
            margin-bottom: calc(var(--spacing-unit) * 3);
            text-shadow: 0 0 8px var(--color-primary);
            border-bottom: 2px solid var(--color-secondary);
            padding-bottom: var(--spacing-unit) * 2;
            display: flex;
            align-items: center;
            gap: var(--spacing-unit) * 2;
        }

        .section-title::before {
            content: '🔗'; /* Link icon for transit map feel */
            font-size: 0.8em;
            color: var(--color-secondary);
        }

        .section-intro {
            font-size: 1.1em;
            color: var(--color-text-light);
            margin-bottom: calc(var(--spacing-unit) * 4);
            font-weight: 300;
        }

        .section ul {
            list-style: none;
            padding: 0;
            margin-top: calc(var(--spacing-unit) * 3);
        }

        .section ul li {
            background-color: #222222;
            border-left: 3px solid var(--color-secondary);
            padding: calc(var(--spacing-unit) * 2);
            margin-bottom: var(--spacing-unit) * 2;
            position: relative;
            box-shadow: 0 0 5px rgba(0, 255, 194, 0.2);
        }
        
        .section ul li strong {
            color: var(--color-primary);
            display: block;
            margin-bottom: var(--spacing-unit);
            font-size: 1.05em;
        }

        .section ul li::before {
            content: '→';
            position: absolute;
            left: calc(var(--spacing-unit) * -3);
            top: var(--spacing-unit) * 2;
            color: var(--color-primary);
            font-weight: bold;
        }

        .footer {
            background-color: #0d0d0d;
            border-top: 2px solid var(--color-secondary);
            padding: calc(var(--spacing-unit) * 4) 0;
            text-align: center;
            font-size: 0.9em;
            color: #AAAAAA;
        }

        .footer p {
            margin: var(--spacing-unit) 0;
        }

        .footer a {
            color: var(--color-primary);
            text-decoration: none;
            transition: color 0.3s ease;
        }

        .footer a:hover {
            color: var(--color-secondary);
        }

        /* Responsive adjustments */
        @media (max-width: 768px) {
            .hero-title {
                font-size: 2.5em;
            }
            .hero-subtitle {
                font-size: 1.2em;
            }
            nav ul {
                flex-direction: column;
                gap: var(--spacing-unit) * 2;
            }
</body>
